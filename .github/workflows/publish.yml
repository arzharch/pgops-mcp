name: Publish

# Publishing is tag-gated. The order of jobs is load-bearing rather than tidy: the MCP
# Registry stores metadata only, and validates that the artifact it points at already
# exists and carries proof of ownership. Publishing metadata before the package fails.
on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q

      # tests/test_registry_manifest.py already checks that server.json validates, that
      # every version string agrees, and that both ownership markers are present. The
      # only thing it cannot know is the git tag, so that is all that is checked here.
      - name: Tag must match the version the manifest declares
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRV=$(uv run python -c "import json,pathlib;print(json.loads(pathlib.Path('server.json').read_text())['version'])")
          echo "tag=$TAG server.json=$SRV"
          test "$TAG" = "$SRV"

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted Publishing: PyPI mints a short-lived token for this workflow, so no
      # long-lived API token has to exist as a repository secret at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/arm64 as well as amd64: Apple Silicon is a normal developer machine,
          # and an amd64-only image runs there under emulation or not at all.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/arzharch/pgops-mcp:${{ github.ref_name }}
            ghcr.io/arzharch/pgops-mcp:latest

  registry:
    # Last, and only after both artifacts exist: the registry validates that the PyPI
    # package and the container image are really published and really ours.
    needs: [pypi, container]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token used to prove the io.github.arzharch namespace
      contents: read # actions/checkout — an explicit permissions block denies the rest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
      # GitHub OIDC rather than an interactive device-code login: the namespace is
      # io.github.arzharch/*, and this repository's own identity is what proves it.
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
