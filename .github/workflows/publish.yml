name: Publish

# Job order is load-bearing rather than tidy: the MCP Registry stores metadata only, and
# validates that the artifacts it points at already exist. Publishing metadata first
# fails, which is why `registry` runs last and depends on both package jobs.
#
# Every job is idempotent, so a release that failed partway can simply be re-run. That is
# not hypothetical — v0.1.1 published to PyPI and GHCR, then failed at the registry step,
# and a re-run had to not choke on the artifacts that already existed.
on:
  push:
    tags: ["v*"]
  # Retry a partially-failed release without deleting and re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.1.1"
        required: true

jobs:
  setup:
    # Resolves the tag once, for everything downstream. On a tag push `github.ref_name`
    # is the tag; on workflow_dispatch it is the *branch*, which is the trap this job
    # exists to remove.
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          # The git tag is `v0.1.1`; the *version* is `0.1.1`. server.json, PyPI and OCI
          # all use the bare semver, and conflating the two is what broke the first
          # release: the image published as `v0.1.1` while the manifest pointed at
          # `0.1.1`, and the registry refused it with "OCI image does not exist".
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

  verify:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q

      # tests/test_registry_manifest.py checks that server.json validates, that every
      # version string agrees, and that both ownership markers are present. The only
      # thing it cannot know is the git tag, so that is what is checked here.
      - name: Tag must match the version the manifest declares
        run: |
          SRV=$(uv run python -c "import json,pathlib;print(json.loads(pathlib.Path('server.json').read_text())['version'])")
          echo "tag version=${{ needs.setup.outputs.version }}  server.json=$SRV"
          test "${{ needs.setup.outputs.version }}" = "$SRV"

  pypi:
    needs: [setup, verify]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted Publishing: PyPI mints a short-lived token for this workflow, so no
      # long-lived API token has to exist as a repository secret at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A retry after a later job failed must not die here. PyPI versions are
          # immutable, so "already uploaded" is a success condition on a re-run.
          skip-existing: true

  container:
    needs: [setup, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/arm64 as well as amd64: Apple Silicon is a normal developer machine,
          # and an amd64-only image runs there under emulation or not at all.
          platforms: linux/amd64,linux/arm64
          # Bare semver, matching server.json's identifier. See the note in `setup`.
          tags: |
            ghcr.io/arzharch/pgops-mcp:${{ needs.setup.outputs.version }}
            ghcr.io/arzharch/pgops-mcp:latest

  github-release:
    # A GitHub Release is where most people land from a tag or a changelog link, so the
    # notes are generated from CHANGELOG.md rather than written twice — two hand-written
    # descriptions of one release drift immediately, and the one nobody regenerates is
    # the one that goes stale.
    needs: [setup, pypi, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a release writes to the repository
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}
      - uses: astral-sh/setup-uv@v5
      - name: Build release notes from the changelog
        run: uv run python scripts/release_notes.py "${{ needs.setup.outputs.version }}" > NOTES.md
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file NOTES.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file NOTES.md --verify-tag
          fi

  registry:
    # Last, and only after both artifacts exist: the registry checks that the PyPI
    # package and the OCI image are really published and really ours.
    needs: [setup, pypi, container]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token proving the io.github.arzharch namespace
      contents: read # actions/checkout — an explicit permissions block denies the rest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.tag }}
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
      # The registry validates that the OCI image exists before accepting the manifest.
      # Checking it here turns a confusing 400 at the last step into a clear failure.
      - name: The image the manifest points at must exist
        run: |
          IMAGE=$(python3 -c "import json;print([p['identifier'] for p in json.load(open('server.json'))['packages'] if p['registryType']=='oci'][0])")
          echo "manifest points at: $IMAGE"
          docker manifest inspect "$IMAGE" > /dev/null
      # GitHub OIDC rather than an interactive device-code login: the namespace is
      # io.github.arzharch/*, and this repository's own identity is what proves it.
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
