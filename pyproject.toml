[project]
name = "pgops-mcp"
version = "0.1.0"
description = "Production-grade MCP server: safe, audited PostgreSQL operations + Docker environment awareness for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Arsh Zakee Chowhan" }]
dependencies = [
    "fastmcp>=2.3",
    "asyncpg>=0.29",
    "sqlparse>=0.5",
    # Phase 5 adds: docker
]

[project.scripts]
pgops-mcp = "pgops.__main__:main"

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.25"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.7,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pgops"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: spawns the server as a subprocess (stdio transport end-to-end)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlparse.*"
ignore_missing_imports = true
